<div class="mod-cruise">
    <div class="mod-cruise-head">
        <span class="mod-eyebrow">CRUISE CONTROL</span>
        <div class="mod-cruise-status-group">
            <span class="mod-cruise-action" data-ref="action">WAITING</span>
            <span class="mod-cruise-badge" data-ref="status">IDLE</span>
        </div>
    </div>

    <div class="mod-cruise-body">
        <div class="mod-cruise-meters">
            <div class="mod-cruise-meter">
                <div class="mod-cruise-meter-top">
                    <span class="mod-cruise-key">THROTTLE</span>
                    <span class="mod-cruise-val is-throttle-val" data-ref="throttle">--%</span>
                </div>
                <div class="mod-cruise-bar-track">
                    <div class="mod-cruise-bar-fill is-throttle" data-ref="throttleBar"></div>
                </div>
            </div>
            <div class="mod-cruise-meter">
                <div class="mod-cruise-meter-top">
                    <span class="mod-cruise-key">BRAKE</span>
                    <span class="mod-cruise-val is-brake-val" data-ref="brake">--%</span>
                </div>
                <div class="mod-cruise-bar-track">
                    <div class="mod-cruise-bar-fill is-brake" data-ref="brakeBar"></div>
                </div>
            </div>
        </div>

        <div class="mod-cruise-controls">
            <div class="mod-cruise-ctrl-card">
                <span class="mod-cruise-ctrl-label">CRUISE POWER</span>
                <div class="mod-cruise-seg" role="group" aria-label="Cruise Power">
                    <button type="button" class="mod-cruise-btn is-on" data-ref="btnOn">ON</button>
                    <button type="button" class="mod-cruise-btn is-off is-active" data-ref="btnOff">OFF</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.TSWDashboard && window.TSWDashboard.registerModule("cruise", {
        init: function (el) {
            const state = window.TSWDashboard.getState ? window.TSWDashboard.getState() : null;
            el._cruiseEnabled = Boolean(state && state.cruiseEnabled);

            const btnOn = el.querySelector('[data-ref="btnOn"]');
            const btnOff = el.querySelector('[data-ref="btnOff"]');
            const statusEl = el.querySelector('[data-ref="status"]');
            const actionEl = el.querySelector('[data-ref="action"]');

            function syncButtons() {
                if (state) state.cruiseEnabled = el._cruiseEnabled;
                if (btnOn) btnOn.classList.toggle("is-active", el._cruiseEnabled);
                if (btnOff) btnOff.classList.toggle("is-active", !el._cruiseEnabled);

                if (statusEl) {
                    statusEl.textContent = el._cruiseEnabled ? "ACTIVE" : "IDLE";
                    statusEl.classList.toggle("is-active", el._cruiseEnabled);
                }
                if (!el._cruiseEnabled && actionEl) {
                    actionEl.textContent = "WAITING";
                    actionEl.className = "mod-cruise-action";
                }
            }

            if (btnOn) {
                btnOn.addEventListener("click", function () {
                    el._cruiseEnabled = true;
                    syncButtons();
                });
            }
            if (btnOff) {
                btnOff.addEventListener("click", async function () {
                    el._cruiseEnabled = false;
                    syncButtons();
                    if (window.TSW6) {
                        await window.TSW6.setThrottle(0);
                    }
                });
            }

            syncButtons();
        },
        update: async function (el, state) {
            const throttleEl = el.querySelector('[data-ref="throttle"]');
            const brakeEl = el.querySelector('[data-ref="brake"]');
            const throttleBarEl = el.querySelector('[data-ref="throttleBar"]');
            const brakeBarEl = el.querySelector('[data-ref="brakeBar"]');
            const actionEl = el.querySelector('[data-ref="action"]');

            const tPct = typeof state.throttle === "number" ? Math.round(state.throttle * 100) : null;
            const bPct = typeof state.brake === "number" ? Math.round(state.brake * 100) : null;

            if (throttleEl) throttleEl.textContent = tPct !== null ? tPct + "%" : "--%";
            if (brakeEl) brakeEl.textContent = bPct !== null ? bPct + "%" : "--%";
            if (throttleBarEl) throttleBarEl.style.width = (tPct !== null ? Math.min(100, Math.max(0, tPct)) : 0) + "%";
            if (brakeBarEl) brakeBarEl.style.width = (bPct !== null ? Math.min(100, Math.max(0, bPct)) : 0) + "%";

            if (!el._cruiseEnabled) {
                return;
            }

            if (window.TSW6 && state.speedLimit > 0) {
                const target = state.speedLimit - 1.5;
                const diff = target - state.speed;
                if (diff > 2) {
                    if (actionEl) {
                        actionEl.textContent = "ACCEL";
                        actionEl.className = "mod-cruise-action is-accel";
                    }
                    await window.TSW6.setBrake(0);
                    await window.TSW6.setThrottle(Math.min(100, Math.max(20, diff * 15)));
                } else if (diff < -1.5) {
                    if (actionEl) {
                        actionEl.textContent = "BRAKE";
                        actionEl.className = "mod-cruise-action is-brake";
                    }
                    await window.TSW6.setThrottle(0);
                    await window.TSW6.setBrake(Math.min(80, Math.abs(diff) * 18));
                } else {
                    if (actionEl) {
                        actionEl.textContent = "MAINTAIN";
                        actionEl.className = "mod-cruise-action is-maintain";
                    }
                    await window.TSW6.setBrake(0);
                    await window.TSW6.setThrottle(15);
                }
            } else if (actionEl) {
                actionEl.textContent = "STANDBY";
                actionEl.className = "mod-cruise-action";
            }
        }
    });
</script>
