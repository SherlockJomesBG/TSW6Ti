<div class="mod-dynamics">
    <div class="mod-eyebrow">DYNAMICS</div>
    <div class="mod-dynamics-center">
        <div class="mod-dynamics-readout">
            <div class="mod-dynamics-val" data-ref="accelVal">0.00</div>
            <div class="mod-dynamics-unit">m/s&sup2;</div>
        </div>
        <div class="mod-dynamics-meter-block">
            <div class="mod-dynamics-bar-wrap">
                <div class="mod-dynamics-track-neg">
                    <div class="mod-dynamics-fill-neg" data-ref="barNeg"></div>
                </div>
                <div class="mod-dynamics-center-tick"></div>
                <div class="mod-dynamics-track-pos">
                    <div class="mod-dynamics-fill-pos" data-ref="barPos"></div>
                </div>
            </div>
            <div class="mod-dynamics-scale">
                <span>-2.5 BRAKE</span>
                <span>0.0</span>
                <span>+2.5 POWER</span>
            </div>
        </div>
        <div class="mod-dynamics-badge" data-ref="stateBadge">COASTING</div>
    </div>
</div>

<script>
    window.TSWDashboard && window.TSWDashboard.registerModule("dynamics", {
        update: function (el, state) {
            const accel = state.acceleration || 0;
            const valEl = el.querySelector('[data-ref="accelVal"]');
            const negEl = el.querySelector('[data-ref="barNeg"]');
            const posEl = el.querySelector('[data-ref="barPos"]');
            const badgeEl = el.querySelector('[data-ref="stateBadge"]');

            if (valEl) {
                valEl.textContent = accel.toFixed(2);
                valEl.classList.toggle("is-braking", accel <= -0.05);
                valEl.classList.toggle("is-powering", accel >= 0.05);
            }

            const ACCEL_MAX = 2.5;
            if (accel >= 0.05) {
                const pct = Math.min(accel / ACCEL_MAX, 1) * 100;
                if (posEl) posEl.style.width = pct.toFixed(1) + "%";
                if (negEl) negEl.style.width = "0%";
                if (badgeEl) {
                    badgeEl.textContent = "POWERING";
                    badgeEl.className = "mod-dynamics-badge state-power";
                }
            } else if (accel <= -0.05) {
                const pct = Math.min(Math.abs(accel) / ACCEL_MAX, 1) * 100;
                if (negEl) negEl.style.width = pct.toFixed(1) + "%";
                if (posEl) posEl.style.width = "0%";
                if (badgeEl) {
                    badgeEl.textContent = "BRAKING";
                    badgeEl.className = "mod-dynamics-badge state-brake";
                }
            } else {
                if (posEl) posEl.style.width = "0%";
                if (negEl) negEl.style.width = "0%";
                if (badgeEl) {
                    badgeEl.textContent = "COASTING";
                    badgeEl.className = "mod-dynamics-badge";
                }
            }
        }
    });
</script>
