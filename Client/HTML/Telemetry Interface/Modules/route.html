<div class="mod-route">
    <div class="mod-eyebrow">ROUTE POSITION</div>
    <div class="mod-route-grid">
        <div class="mod-route-item">
            <span class="mod-route-label">ROUTE</span>
            <div class="mod-route-val" data-ref="routeName">Detecting...</div>
            <span class="mod-route-sub" data-ref="routeDir">Awaiting GPS coordinates</span>
        </div>
        <div class="mod-route-item">
            <span class="mod-route-label" data-ref="stationLabel">NEXT STATION</span>
            <div class="mod-route-val is-station" data-ref="stationName">---</div>
            <span class="mod-route-sub" data-ref="stationSub">&mdash;</span>
        </div>
        <div class="mod-route-item">
            <span class="mod-route-label" data-ref="distLabel">DISTANCE TO STATION</span>
            <div class="mod-route-dist-row">
                <span class="mod-route-dist" data-ref="distance">---</span>
                <span class="mod-route-unit" data-ref="distUnit">mi</span>
            </div>
        </div>
    </div>
</div>

<script>
    window.TSWDashboard && window.TSWDashboard.registerModule("route", {
        update: function (el, state) {
            const routeNameEl = el.querySelector('[data-ref="routeName"]');
            const routeDirEl = el.querySelector('[data-ref="routeDir"]');
            const stationLabelEl = el.querySelector('[data-ref="stationLabel"]');
            const stationNameEl = el.querySelector('[data-ref="stationName"]');
            const stationSubEl = el.querySelector('[data-ref="stationSub"]');
            const distLabelEl = el.querySelector('[data-ref="distLabel"]');
            const distEl = el.querySelector('[data-ref="distance"]');
            const unitEl = el.querySelector('[data-ref="distUnit"]');

            const isMetric = state.speedUnit === "KMH" || state.speedUnit === "MS";
            const distMultiplier = isMetric ? 1.609344 : 1;
            const unitText = isMetric ? "km" : "mi";

            if (unitEl) unitEl.textContent = unitText;

            const r = state.route;
            if (!r) {
                if (routeNameEl) routeNameEl.textContent = "Detecting...";
                if (routeDirEl) routeDirEl.textContent = "Awaiting GPS coordinates";
                if (stationLabelEl) stationLabelEl.textContent = "TARGET STATION";
                if (stationNameEl) stationNameEl.textContent = "---";
                if (stationSubEl) stationSubEl.textContent = "—";
                if (distLabelEl) distLabelEl.textContent = "DISTANCE TO STATION";
                if (distEl) distEl.textContent = "---";
                return;
            }

            if (routeNameEl) routeNameEl.textContent = r.routeName || "Unknown Route";
            if (routeDirEl) {
                routeDirEl.textContent = r.terminus ? "Towards " + r.terminus : "";
            }

            if (stationLabelEl) {
                stationLabelEl.textContent = "NEXT STATION";
            }
            if (stationNameEl) {
                stationNameEl.textContent = r.next || "---";
            }
            if (stationSubEl) {
                if (r.isAtDepartureStation && r.previous) {
                    stationSubEl.textContent = "At / Departing " + r.previous;
                } else if (r.previous) {
                    stationSubEl.textContent = "From " + r.previous;
                } else {
                    stationSubEl.textContent = "—";
                }
            }

            if (distLabelEl) {
                distLabelEl.textContent = "DISTANCE TO STATION";
            }
            if (distEl) {
                const dVal = (r.distanceToNextMiles || 0) * distMultiplier;
                distEl.textContent = dVal.toFixed(2);
            }
        }
    });
</script>
