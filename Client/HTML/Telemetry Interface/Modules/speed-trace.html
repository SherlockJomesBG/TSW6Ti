<style>
    .mod-speed-trace {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .mod-speed-trace-canvas-wrap {
        flex: 1;
        position: relative;
        min-height: 0;
        width: 100%;
        margin-top: 0.45rem;
    }
</style>

<div class="mod-speed-trace">
    <div class="mod-eyebrow">SPEED TRACE &mdash; LAST 60S</div>
    <div class="mod-speed-trace-canvas-wrap">
        <canvas data-ref="canvas"></canvas>
    </div>
</div>

<script>
    window.TSWDashboard && window.TSWDashboard.registerModule("speed-trace", {
        init: function (el, state) {
            const canvas = el.querySelector('[data-ref="canvas"]');
            if (!canvas || typeof Chart === "undefined") return;
            const ctx = canvas.getContext("2d");
            el._chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: state.timeLabels.slice(),
                    datasets: [
                        {
                            label: "Speed (" + state.unitLabel + ")",
                            data: state.speedHistory.slice(),
                            borderColor: "#8b3dff",
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            backgroundColor: "rgba(139, 61, 255, 0.14)",
                            tension: 0.3
                        },
                        {
                            label: "Speed Limit (" + state.unitLabel + ")",
                            data: state.limitHistory.slice(),
                            borderColor: "#fbbf24",
                            borderWidth: 1.5,
                            borderDash: [5, 4],
                            pointRadius: 0,
                            fill: false,
                            tension: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: "rgba(255,255,255,0.45)", font: { size: 9 }, maxTicksLimit: 5, maxRotation: 0 },
                            grid: { color: "rgba(139, 61, 255, 0.08)" },
                            border: { color: "rgba(255,255,255,0.12)" }
                        },
                        y: {
                            min: 0,
                            ticks: { color: "rgba(255,255,255,0.45)", font: { size: 9 } },
                            grid: { color: "rgba(139, 61, 255, 0.08)" },
                            border: { color: "rgba(255,255,255,0.12)" }
                        }
                    }
                }
            });
        },
        update: function (el, state) {
            const chart = el._chart;
            if (!chart) return;
            const layoutEl = document.querySelector(".telem-layout") || document.documentElement;
            const cs = getComputedStyle(layoutEl);
            const accentBright = cs.getPropertyValue("--accent-bright").trim() || "#8b3dff";
            const accentSubtle = cs.getPropertyValue("--accent-subtle").trim() || "rgba(139, 61, 255, 0.14)";
            const textMuted = cs.getPropertyValue("--text-muted").trim() || "rgba(255,255,255,0.45)";
            const divider = cs.getPropertyValue("--telem-divider").trim() || "rgba(255,255,255,0.12)";

            const isOverspeed = state.speedLimit > 0 && state.speed > state.speedLimit;
            chart.data.labels = state.timeLabels.slice();
            chart.data.datasets[0].data = state.speedHistory.slice();
            chart.data.datasets[0].label = "Speed (" + state.unitLabel + ")";
            chart.data.datasets[0].borderColor = isOverspeed ? "#fb7185" : accentBright;
            chart.data.datasets[0].backgroundColor = isOverspeed ? "rgba(244, 63, 94, 0.16)" : accentSubtle;
            chart.data.datasets[1].data = state.limitHistory.slice();
            chart.data.datasets[1].label = "Speed Limit (" + state.unitLabel + ")";

            chart.options.scales.x.ticks.color = textMuted;
            chart.options.scales.y.ticks.color = textMuted;
            chart.options.scales.x.grid.color = divider;
            chart.options.scales.y.grid.color = divider;
            chart.options.scales.x.border.color = divider;
            chart.options.scales.y.border.color = divider;
            chart.update("none");
        },
        resize: function (el) {
            if (el._chart) el._chart.resize();
        },
        destroy: function (el) {
            if (el._chart) {
                el._chart.destroy();
                el._chart = null;
            }
        }
    });
</script>
