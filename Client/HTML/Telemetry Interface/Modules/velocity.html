<style>
    .mod-velocity {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-height: 0;
    }

    .mod-velocity-head {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .mod-velocity-overspeed {
        padding: 0.16rem 0.55rem;
        border-radius: 4px;
        background: rgba(244, 63, 94, 0.2);
        border: 1px solid rgba(244, 63, 94, 0.55);
        color: #fda4af;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.1em;
    }

    .mod-velocity-overspeed[hidden] {
        display: none !important;
    }

    .mod-velocity-body {
        flex: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        min-height: 0;
    }

    .mod-velocity-gauge-wrap {
        position: relative;
        flex: 1;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
    }

    .mod-velocity-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    .mod-velocity-ticks line {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1.5;
    }

    .mod-velocity-ticks line.major {
        stroke: rgba(168, 85, 247, 0.58);
        stroke-width: 2.2;
    }

    .mod-velocity-stats {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        flex-shrink: 0;
    }

    .mod-velocity-stat-card {
        background: rgba(255, 255, 255, 0.028);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 0.45rem 0.6rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.15rem;
    }

    .mod-velocity-stat-key {
        font-size: 0.54rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    .mod-velocity-stat-val {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 0.96rem;
        font-weight: 800;
        color: var(--text-primary);
    }

    .module-slot[data-size="1x1"] .mod-velocity-stats {
        display: none;
    }

    .module-slot[data-size="1x2"] .mod-velocity-body {
        flex-direction: column;
        gap: 0.6rem;
    }

    .module-slot[data-size="1x2"] .mod-velocity-stats {
        grid-template-columns: 1fr 1fr;
    }

    .module-slot[data-size="1x2"] .mod-velocity-stat-card {
        padding: 0.55rem 0.65rem;
    }

    .module-slot[data-size="1x2"] .mod-velocity-stat-val {
        font-size: 1.1rem;
    }

    .module-slot[data-size="2x1"] .mod-velocity-body {
        flex-direction: row;
        align-items: stretch;
        gap: 0.75rem;
    }

    .module-slot[data-size="2x1"] .mod-velocity-gauge-wrap {
        flex: 1.15;
    }

    .module-slot[data-size="2x1"] .mod-velocity-stats {
        flex: 1;
        width: auto;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
    }

    .module-slot[data-size="2x1"] .mod-velocity-stat-card {
        padding: 0.55rem 0.85rem;
    }

    .module-slot[data-size="2x1"] .mod-velocity-stat-key {
        font-size: 0.6rem;
    }

    .module-slot[data-size="2x1"] .mod-velocity-stat-val {
        font-size: 1.35rem;
    }

    .module-slot[data-size="2x2"] .mod-velocity-body {
        gap: 0.75rem;
    }

    .module-slot[data-size="2x2"] .mod-velocity-stat-card {
        padding: 0.75rem 1rem;
        gap: 0.25rem;
    }

    .module-slot[data-size="2x2"] .mod-velocity-stat-key {
        font-size: 0.68rem;
        letter-spacing: 0.14em;
    }

    .module-slot[data-size="2x2"] .mod-velocity-stat-val {
        font-size: 1.55rem;
    }

    .module-slot[data-size="5x1"] .mod-velocity-body {
        flex-direction: row;
        align-items: stretch;
        gap: 1.25rem;
    }

    .module-slot[data-size="5x1"] .mod-velocity-gauge-wrap {
        flex: 0.8;
    }

    .module-slot[data-size="5x1"] .mod-velocity-stats {
        flex: 1.5;
        width: auto;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem;
    }

    .module-slot[data-size="5x1"] .mod-velocity-stat-card {
        padding: 0.85rem 1.25rem;
        gap: 0.3rem;
    }

    .module-slot[data-size="5x1"] .mod-velocity-stat-key {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
    }

    .module-slot[data-size="5x1"] .mod-velocity-stat-val {
        font-size: 1.85rem;
    }
</style>

<div class="mod-velocity">
    <div class="mod-velocity-head">
        <span class="mod-eyebrow">VELOCITY</span>
        <span class="mod-velocity-overspeed" data-ref="overspeed" hidden>&#9888; OVERSPEED</span>
    </div>
    <div class="mod-velocity-body">
        <div class="mod-velocity-gauge-wrap">
            <svg class="mod-velocity-svg" viewBox="0 0 200 190" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <path d="M 39.9 160.1 A 85 85 0 1 1 160.1 160.1" fill="none"
                    stroke="var(--telem-track-bg, rgba(255,255,255,0.08))" stroke-width="12" stroke-linecap="round" />
                <g class="mod-velocity-ticks" data-ref="ticks"></g>
                <path data-ref="arcFill" d="M 39.9 160.1 A 85 85 0 1 1 160.1 160.1" fill="none"
                    stroke="var(--accent-bright, #8b3dff)" stroke-width="9" stroke-linecap="round"
                    stroke-dasharray="401" stroke-dashoffset="401" />
                <circle data-ref="limitMarker" cx="100" cy="15" r="6" fill="#fbbf24" opacity="0" />
                <text x="36" y="178" fill="var(--text-muted, #827b96)" font-size="10" font-family="monospace"
                    text-anchor="middle" font-weight="bold">0</text>
                <text data-ref="arcMax" x="164" y="178" fill="var(--text-muted, #827b96)" font-size="10"
                    font-family="monospace" text-anchor="middle" font-weight="bold">140</text>

                <text data-ref="speedVal" x="100" y="92" text-anchor="middle" dominant-baseline="central"
                    fill="var(--text-primary, #ffffff)" font-family="'JetBrains Mono', 'Fira Code', monospace"
                    font-size="46" font-weight="800">0</text>
                <text data-ref="speedUnit" x="100" y="124" text-anchor="middle" fill="var(--text-muted, #9a93ad)"
                    font-size="12" font-weight="700" letter-spacing="2">MPH</text>

                <rect x="64" y="146" width="72" height="22" rx="11" fill="var(--telem-input-bg, rgba(12, 5, 24, 0.92))"
                    stroke="var(--border-purple, rgba(139, 61, 255, 0.42))" stroke-width="1.2" />
                <text data-ref="limitVal" x="100" y="157" text-anchor="middle" dominant-baseline="central"
                    fill="#fbbf24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11"
                    font-weight="700">LIM &mdash;</text>
            </svg>
        </div>

        <div class="mod-velocity-stats">
            <div class="mod-velocity-stat-card">
                <span class="mod-velocity-stat-key">TRACK LIMIT</span>
                <span class="mod-velocity-stat-val" data-ref="cardLimit" style="color: #fbbf24;">&mdash;</span>
            </div>
            <div class="mod-velocity-stat-card">
                <span class="mod-velocity-stat-key">MARGIN</span>
                <span class="mod-velocity-stat-val" data-ref="cardMargin" style="color: #34d399;">&mdash;</span>
            </div>
        </div>
    </div>
</div>

<script>
    window.TSWDashboard && window.TSWDashboard.registerModule("velocity", {
        init: function (el) {
            const tickGroup = el.querySelector('[data-ref="ticks"]');
            if (!tickGroup || tickGroup.childNodes.length > 0) return;
            const cx = 100, cy = 100, r = 85;
            const startDeg = 135, sweepDeg = 270, steps = 28;
            for (let i = 0; i <= steps; i++) {
                const angle = startDeg + (i / steps) * sweepDeg;
                const rad = (angle * Math.PI) / 180;
                const isMajor = i % 4 === 0;
                const inner = isMajor ? r - 13 : i % 2 === 0 ? r - 9 : r - 5;
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", (cx + r * Math.cos(rad)).toFixed(1));
                line.setAttribute("y1", (cy + r * Math.sin(rad)).toFixed(1));
                line.setAttribute("x2", (cx + inner * Math.cos(rad)).toFixed(1));
                line.setAttribute("y2", (cy + inner * Math.sin(rad)).toFixed(1));
                if (isMajor) line.classList.add("major");
                tickGroup.appendChild(line);
            }
        },
        update: function (el, state) {
            const ARC_LENGTH = 401;
            const maxSpeed = state.maxGaugeSpeed || 140;

            const speedValEl = el.querySelector('[data-ref="speedVal"]');
            const speedUnitEl = el.querySelector('[data-ref="speedUnit"]');
            const limitValEl = el.querySelector('[data-ref="limitVal"]');
            const cardLimitEl = el.querySelector('[data-ref="cardLimit"]');
            const cardMarginEl = el.querySelector('[data-ref="cardMargin"]');
            const arcFillEl = el.querySelector('[data-ref="arcFill"]');
            const limitMarkerEl = el.querySelector('[data-ref="limitMarker"]');
            const arcMaxEl = el.querySelector('[data-ref="arcMax"]');
            const overspeedEl = el.querySelector('[data-ref="overspeed"]');

            const speed = state.speed || 0;
            const limit = state.speedLimit || 0;
            const isOverspeed = limit > 0 && speed > limit;
            const unitLabel = state.unitLabel || "mph";

            if (arcMaxEl) arcMaxEl.textContent = String(maxSpeed);
            if (speedValEl) {
                speedValEl.textContent = String(Math.round(speed));
                speedValEl.setAttribute("fill", isOverspeed ? "#fb7185" : "var(--text-primary, #ffffff)");
            }
            if (speedUnitEl) speedUnitEl.textContent = unitLabel.toUpperCase();
            if (limitValEl) limitValEl.textContent = limit > 0 ? "LIM " + Math.round(limit) : "LIM —";
            if (overspeedEl) overspeedEl.hidden = !isOverspeed;

            if (cardLimitEl) {
                cardLimitEl.textContent = limit > 0 ? Math.round(limit) + " " + unitLabel : "—";
            }
            if (cardMarginEl) {
                if (limit > 0) {
                    const margin = limit - speed;
                    cardMarginEl.textContent = (margin >= 0 ? "+" : "") + margin.toFixed(1) + " " + unitLabel;
                    cardMarginEl.style.color = margin < 0 ? "#fb7185" : margin < 5 ? "#fbbf24" : "#34d399";
                } else {
                    cardMarginEl.textContent = "—";
                    cardMarginEl.style.color = "var(--text-muted)";
                }
            }

            if (arcFillEl) {
                const pct = Math.min(Math.max(speed / maxSpeed, 0), 1);
                const offset = ARC_LENGTH - pct * ARC_LENGTH;
                arcFillEl.setAttribute("stroke-dashoffset", offset.toFixed(1));
                arcFillEl.setAttribute("stroke", isOverspeed ? "#fb7185" : "var(--accent-bright, #8b3dff)");
            }

            if (limitMarkerEl) {
                if (limit > 0) {
                    const limitPct = Math.min(limit / maxSpeed, 1);
                    const rad = ((135 + limitPct * 270) * Math.PI) / 180;
                    limitMarkerEl.setAttribute("cx", (100 + 85 * Math.cos(rad)).toFixed(1));
                    limitMarkerEl.setAttribute("cy", (100 + 85 * Math.sin(rad)).toFixed(1));
                    limitMarkerEl.setAttribute("opacity", "1");
                } else {
                    limitMarkerEl.setAttribute("opacity", "0");
                }
            }
        }
    });
</script>
